<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Dashboard</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#e9e9ee;font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:#26262e;-webkit-font-smoothing:antialiased;}
  a{color:#1e1b6b;text-decoration:none;} a:hover{color:#3a9fd6;}
  select{font-family:inherit;}
  table{border-collapse:collapse;}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-thumb{background:#b9b9c4;border-radius:6px;border:2px solid #e9e9ee;}
  ::-webkit-scrollbar-track{background:transparent;}
  .panel{background:#fff;border:1px solid #edeef2;border-radius:7px;padding:10px 12px;box-shadow:0 1px 2px rgba(16,24,40,0.05),0 4px 10px rgba(16,24,40,0.06);}
  .ttl{font-size:11px;font-weight:700;letter-spacing:.05em;color:#6c6c7a;text-transform:uppercase;}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0;}.dashrow1>.col{height:450px;overflow:visible;}.dashrow1 .panel{flex:0 0 auto;}.dashrow1 .panel.flexcard{flex:1 1 0;min-height:0;overflow-y:auto;}
  /* Rows below row 1 are capped at row-1 height (2 visuals tall); taller content scrolls inside its own panel. */
  .dashstack .panel{max-height:450px;overflow-y:auto;}
  /* Universal click feedback: any button or inline cursor:pointer element dims (and buttons nudge down) while pressed. */
  button,[style*="cursor:pointer"]{transition:opacity .07s ease,transform .07s ease;}
  button:active{transform:translateY(1px);opacity:.85;}
  [style*="cursor:pointer"]:active{opacity:.5;}
  /* PDF/print mode: show each visual's full content (no 450px scroll-clip) and keep a whole
     row together — a row that would straddle a page break moves to the next page instead of splitting.
     (A single visual taller than a full page must still split — nothing else is physically possible.) */
  .printwrap .dashstack .panel{max-height:none;overflow:visible;}
  .printwrap .dashstack,.printwrap .dashrow1,.printwrap .panel{break-inside:avoid;}
</style>
</head>
<body>
<div id="app"></div>
<input id="fileInput" type="file" accept=".xlsx,.xls,.csv" style="display:none">

  // ---- coercion helpers (tolerant) ----
  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
  function dateISO(v){
    if(v==null||v==='') return null;
    if(v instanceof Date) return isNaN(v)?null:v.toISOString().slice(0,10);
    var s=String(v).trim();
    if(/^\d+(\.\d+)?$/.test(s)){ var n=parseFloat(s); if(n>1000){ return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10); } }
    var d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10);
  }
  function normalize(a){
    var o={},k;
    for(k in COLMAP){ var v=a[COLMAP[k]]; o[k]=(v==null)?'':String(v); }
    for(k in NUMMAP){ o[k]=num(a[NUMMAP[k]]); }
    for(k in DATEMAP){ o[k]=dateISO(a[DATEMAP[k]]); }
    return o;
  }

  // ---- aggregation ----
  // Monday week-start for the reserved __week filter (set by clicking a trend bar).
  function weekMon(iso){ var dt=new Date(iso+'T00:00:00Z'); var off=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-off); return dt.toISOString().slice(0,10); }
  function filtered(){ return ROWS.filter(function(r){
    for(var k in filters){ if(filters[k]==null) continue;
      if(k==='__week'){ var dd=r.actFin||r.actStart; if(!dd||weekMon(dd)!==filters[k]) return false; }
      else if(String(r[k])!==String(filters[k])) return false; }
    return true; }); }
  function distinct(key){ var s={},out=[],i; for(i=0;i<ROWS.length;i++){ var v=ROWS[i][key]; if(v!==''&&v!=null&&!s[v]){ s[v]=1; out.push(String(v)); } } return out.sort(); }
  function fmt(n){ return Math.round(n||0).toLocaleString('en-US'); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function heat(p){ var h=Math.round(Math.max(0,Math.min(100,p))*1.2); return 'hsl('+h+',72%,43%)'; }
  function pctColor(p){ return p>=99.5?GREEN:(p>=1?'#22222c':'#9a9aa6'); }

  // ---- svg donut ----
  function donut(parts,size){
    var r=54,C=2*Math.PI*r,tot=0,i; for(i=0;i<parts.length;i++) tot+=parts[i].value; if(!tot) tot=1;
    var acc=0,segs='';
    for(i=0;i<parts.length;i++){ if(parts[i].value<=0) continue; var frac=parts[i].value/tot,len=frac*C;
      segs+='<circle cx="66" cy="66" r="54" fill="none" stroke="'+parts[i].color+'" stroke-width="20" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc*C).toFixed(2)+'"></circle>'; acc+=frac; }
    return '<svg viewBox="0 0 132 132" style="width:'+size+'px;height:'+size+'px;transform:rotate(-90deg);flex:none;">'+segs+'</svg>';
  }

  // ---- header ----
  function headerHTML(){
    var subtitle = distinct('projectId').map(function(p){ var d=PROJECTS[p]; return d ? (p+': '+d) : p; }).join(', ') || '\u2014';
    var lbl = loaded ? 'Import weekly file' : 'Import weekly file';
    var sub = fileName || 'Drop or click to load .xlsx / .csv';
    var logo = LOGO ? '<img src="'+LOGO+'" alt="Summit Industrial" style="max-width:172px;max-height:56px;object-fit:contain;">'
                    : '<div style="font-size:22px;font-weight:800;color:'+NAVY+';">SUMMIT</div>';
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;padding:12px 16px;border-bottom:1px solid #dedee5;position:sticky;top:0;z-index:40;">'
      +'<div style="height:56px;display:flex;align-items:center;flex:none;">'+logo+'</div>'
      +'<div data-import style="display:flex;align-items:center;gap:9px;border:1px dashed #55555f;border-radius:5px;padding:6px 13px;cursor:pointer;flex:none;">'
        +'<span style="font-size:15px;color:#5a5a68;">&#8681;</span>'
        +'<span style="display:flex;flex-direction:column;line-height:1.15;">'
          +'<span style="font-size:11px;font-weight:700;color:#2b2b36;">'+esc(lbl)+'</span>'
          +'<span style="font-size:10px;color:#8a8a96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;">'+esc(sub)+'</span>'
        +'</span>'
      +'</div>'
      +'<div style="text-align:right;flex:1;min-width:0;">'
        +'<div style="font-size:clamp(20px,3vw,34px);font-weight:800;letter-spacing:.01em;color:#1b1b22;line-height:.95;white-space:nowrap;">PROGRESS DASHBOARD</div>'
        +'<div style="font-size:12px;color:#6a6a78;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(subtitle)+'</div>'
      +'</div>'
    +'</div>';
  }

  // ---- filter rail ----

  // ============================================================
  //  DATA-DRIVEN ENGINE (Project Dashboard Customization, PRD step 2)
  //  The shipped report expressed as a locked layout. Each visual is a
  //  definition the generic engine renders. Colors are omitted here on
  //  purpose — the per-type renderers fall back to the current Summit
  //  defaults, so an unedited Default is pixel-identical to the legacy
  //  render(). measure:'basis' = follow the Progress-basis selector
  //  (matches today, where agg() reads the global basis).
  // ============================================================
  var DEFAULT_LAYOUT={
    id:'default', name:'Default', schemaVersion:1, locked:true,
    // Row 1 — fixed four columns, max two visuals each.
    row1:[
      [ {id:'ovr',  type:'ring',      title:'Overall Progress',   measure:'basis', center:'pct', showTiles:false},
        {id:'conn', type:'statTiles', title:'Summit Connections', aggregate:'count', showRing:true, flex:true,
          complete:{ label:'Connections Complete', where:[{field:'roc',op:'Equals',value:'4.CON'},{field:'status',op:'Equals',value:'Complete',logic:'AND'}] },
          total:   { label:'Total Connections',    where:[{field:'roc',op:'Equals',value:'4.CON'}] } } ],
      [ {id:'phase',type:'donut',     title:'Progress by Phase',  groupBy:'phase', measure:'basis', showCenter:true, center:'pct', showTable:true, sort:'budgetDesc', colorByLabel:PHCOL, flex:true} ],
      [ {id:'comp', type:'table',     title:'Component Type',     groupBy:'comp',  measure:'basis', sort:'budgetDesc', highlightComplete:true, flex:true},
        {id:'area', type:'table',     title:'Area',               groupBy:'area',  measure:'basis', sort:'budgetDesc', highlightComplete:true, flex:true} ],
      [ {id:'roc',  type:'barList',   title:'ROC Step Progress',  groupBy:'roc',   measure:'basis', sort:'labelAsc',   highlightComplete:true, flex:true},
        {id:'shop', type:'barList',   title:'Shop / Field Progress',groupBy:'shop',measure:'basis', sort:'budgetDesc', highlightComplete:true} ]
    ],
    // Rows 2+ — each visual here is stretched to fill its own row today.
    rows:[
      { stretch:true, visuals:[ {id:'heat', type:'heatmap', title:'Area / Module Progress by Phase', rowGroup:'module', colGroup:'phase', measure:'basis', maxCols:8, rowNoun:'modules'} ] },
      { stretch:true, visuals:[ {id:'cum',  type:'trend',   title:'Cumulative Progress — Week over Week', mode:'cumulative', measure:'budgetMH', weekStart:'mon', highlightComplete:true} ] },
      { stretch:true, visuals:[ {id:'wk',   type:'trend',   title:'Weekly Progress — Earned MH per Week',  mode:'perWeek',   measure:'budgetMH', weekStart:'mon', barColor:'#3c5c9e'} ] }
    ],
    footer:{ left:'', right:'' }
  };
  // The layout the report currently renders (Default until C# posts a custom one).
  var activeLayout=DEFAULT_LAYOUT;

  // ---- engine: shared helpers ----
  // Resolve a visual's measure to a numeric field key. 'basis' follows the
  // global Progress-basis selector, matching how legacy agg() reads basis.
  function measureField(m){ return (!m||m==='basis')?basis:m; }
  // Aggregate rows weighted by a specific field, earning by pct.
  function aggWith(rows,field){ var b=0,e=0,i; for(i=0;i<rows.length;i++){ var w=+rows[i][field]||0; b+=w; e+=w*((+rows[i].pct||0)/100); } return {budget:b,earn:e,pct:b?e/b*100:0,count:rows.length}; }
  // One where-condition against a normalized row value.
  // Matches the Progress module's filter operators (Models/UserFilter.FilterCriteria), case-insensitive.
  function cmp(a,b){ var na=parseFloat(a),nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb)) return na<nb?-1:(na>nb?1:0); var sa=String(a),sb=String(b); return sa<sb?-1:(sa>sb?1:0); }
  function condOne(v,op,val){ var s=String(v==null?'':v), sl=s.toLowerCase(), fl=String(val==null?'':val).toLowerCase();
    switch(op){
      case 'Equals': case '=': return sl===fl;
      case 'Not Equals': case '!=': return sl!==fl;
      case 'Contains': return sl.indexOf(fl)>=0;
      case 'Does Not Contain': return sl.indexOf(fl)<0;
      case 'Starts With': return sl.indexOf(fl)===0;
      case 'Ends With': return fl===''||(sl.length>=fl.length&&sl.lastIndexOf(fl)===sl.length-fl.length);
      case 'Is Empty': return s==='';
      case 'Is Not Empty': return s!=='';
      case 'Greater Than': return cmp(v,val)>0;
      case 'Greater Than or Equal': return cmp(v,val)>=0;
      case 'Less Than': return cmp(v,val)<0;
      case 'Less Than or Equal': return cmp(v,val)<=0;
      default: return true;
    } }
  // Fold conditions left-to-right honouring each condition's AND/OR logic (like the Progress filters).
  function rowMatches(r,conds){ if(!conds||!conds.length) return true;
    var res=condOne(r[conds[0].field],conds[0].op,conds[0].value);
    for(var i=1;i<conds.length;i++){ var c=conds[i], m=condOne(r[c.field],c.op,c.value); res=((c.logic||'AND')==='OR')?(res||m):(res&&m); }
    return res; }
  // Drop rows matching a visual's exclude conditions (none on the Default).
  function applyExclude(rows,ex){ if(!ex||!ex.length) return rows; return rows.filter(function(r){ return !rowMatches(r,ex); }); }

  // ---- engine: dispatcher ----
  var RENDERERS={};
  function renderVisual(def,rows){
    var r=applyExclude(rows,def.excludeFilters), fn=RENDERERS[def.type];
    if(!fn) return '<div class="panel"><div class="ttl">'+esc(def.title||'')+'</div><div style="font-size:11px;color:#9a9aa6;">Unsupported visual: '+esc(def.type||'?')+'</div></div>';
    return fn(def,r);
  }

  // ---- engine: ring renderer (port of the Overall Progress panel) ----
  function ringCenter(def,A){
    switch(def.center){ case 'earned':return fmt(A.earn); case 'budget':return fmt(A.budget); case 'count':return fmt(A.count); default:return A.pct.toFixed(1)+'%'; }
  }
  RENDERERS.ring=function(def,rows){

        +'<div style="width:1px;background:#ececf1;"></div>'
        +'<div style="flex:1;text-align:center;"><div style="font-size:21px;font-weight:800;color:#20202c;line-height:1;">'+fmt(A.budget)+'</div><div style="font-size:9px;color:#77778a;margin-top:4px;text-transform:uppercase;">Total</div></div>'
      +'</div>';
    }
    return '<div class="panel" style="align-items:center;display:flex;flex-direction:column;">'
      +'<div class="ttl">'+esc(def.title||'')+'</div>'
      +'<div style="position:relative;width:180px;height:180px;margin:6px 0 4px;">'
        +'<svg viewBox="0 0 180 180" style="width:100%;height:100%;transform:rotate(-90deg);"><circle cx="90" cy="90" r="76" fill="none" stroke="'+rem+'" stroke-width="22"></circle><circle cx="90" cy="90" r="76" fill="none" stroke="'+prog+'" stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"></circle></svg>'
        +'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#20202c;">'+ringCenter(def,A)+'</div>'

  // ---- engine: stat tiles renderer (port of the Summit Connections panel) ----
  // Aggregate rows matching a criteria's where-clause: count of rows, or sum of a column.
  function aggCrit(rows,def,crit){
    var sub=rows.filter(function(r){ return rowMatches(r,(crit&&crit.where)||[]); });
    if(!def.aggregate||def.aggregate==='count') return sub.length;
    var f=def.aggregate, s=0, i; for(i=0;i<sub.length;i++) s+=(+sub[i][f]||0); return s;
  }
  RENDERERS.statTiles=function(def,rows){
    var comp=aggCrit(rows,def,def.complete), tot=aggCrit(rows,def,def.total),

        +'<div style="width:1px;background:#ececf1;"></div>'
        +'<div style="flex:1;text-align:center;"><div style="font-size:21px;font-weight:800;color:#20202c;line-height:1;">'+fmt(tot)+'</div><div style="font-size:9px;color:#77778a;margin-top:4px;text-transform:uppercase;">'+esc((def.total&&def.total.label)||'')+'</div></div>'

  // ---- engine: shared group/color helpers (used by donut, table, bar list) ----
  // Group set matches the legacy groupPct() — distinct values over ALL rows, then
  // aggregated over the passed (filtered) rows with the visual's measure.
  function groupAgg(rows,key,measure){
    var mf=measureField(measure), labels=distinct(key);
    return labels.map(function(L){ var a=aggWith(rows.filter(function(r){return r[key]===L;}),mf); return {label:L,pct:a.pct,budget:a.budget,earn:a.earn}; });
  }
  function sortGroups(groups,sort){
    if(sort==='labelAsc') return groups.slice().sort(function(a,b){return a.label<b.label?-1:(a.label>b.label?1:0);});
    if(sort==='pctDesc')  return groups.slice().sort(function(a,b){return b.pct-a.pct;});
    return groups.slice().sort(function(a,b){return b.budget-a.budget;}); // budgetDesc (default)
  }
  // Column key -> display header.
  function colDisplay(key){ var m={projectId:'Project',status:'Status',comp:'Component Type',phase:'Phase',roc:'ROC Step',area:'Area',module:'Area / Module',shop:'Shop / Field',wp:'Work Package'}; return m[key]||key; }
  // Interpolate between two hex colors (donut "spread" color mode).
  function lerpColor(a,b,t){
    function h(x){ x=x.replace('#',''); if(x.length===3)x=x.replace(/./g,'$&$&'); return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]; }
    var A=h(a),B=h(b); return '#'+[0,1,2].map(function(k){ return ('0'+Math.round(A[k]+(B[k]-A[k])*t).toString(16)).slice(-2); }).join('');
  }
  // One color per group: two-color spread, name-pins (Default phase donut), else the Summit palette by index.
  function sliceColors(def,labels){
    if(def.colorMode==='spread'&&def.spreadFrom&&def.spreadTo){ var n=labels.length; return labels.map(function(_,i){ return lerpColor(def.spreadFrom,def.spreadTo,n<=1?0:i/(n-1)); }); }
    var pal=def.palette||PHPAL, byL=def.colorByLabel||null;
    return labels.map(function(L,i){ return (byL&&byL[L])||pal[i%pal.length]; });
  }

  // ---- engine: composition donut renderer (port of phasePanel) ----
  // Summary-table column visibility (shared by the donut's table and the summary table).
  // showPct / showEarn / showBudget default to true; clients-facing layouts can hide hours.
  function colFlags(def){ return [def.showPct!==false, def.showEarn!==false, def.showBudget!==false]; }
  function colHeads(def){ var f=colFlags(def), h=''; if(f[0]) h+='<th style="font-weight:600;padding:3px 4px;">%</th>'; if(f[1]) h+='<th style="font-weight:600;padding:3px 4px;">EARN</th>'; if(f[2]) h+='<th style="font-weight:600;padding:3px 4px;">BUDGET</th>'; return h; }
  function colCells(def,pctTd,earnTd,budgetTd){ var f=colFlags(def); return (f[0]?pctTd:'')+(f[1]?earnTd:'')+(f[2]?budgetTd:''); }

  RENDERERS.donut=function(def,rows){

        +'<td style="text-align:left;padding:4px;font-weight:600;color:#2b2b36;"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+col+';margin-right:6px;vertical-align:middle;"></span>'+esc(g.label)+'</td>'
        +colCells(def,

          '<td style="text-align:right;padding:4px;color:#3a3a46;">'+fmt(g.earn)+'</td>',

    }

      h+='<table style="width:100%;font-size:11.5px;"><thead><tr style="color:#7a7a88;text-align:right;font-size:10px;"><th style="text-align:left;font-weight:600;padding:3px 4px;">'+colDisplay(def.groupBy).toUpperCase()+'</th>'+colHeads(def)+'</tr></thead><tbody>';
      h+=body;
      h+='<tr style="border-top:2px solid #d6d6de;font-weight:800;"><td style="text-align:left;padding:4px;">Total</td>'+colCells(def,
        '<td style="text-align:right;padding:4px;color:'+pctColor(totPct)+';">'+totPct.toFixed(0)+'%</td>',
        '<td style="text-align:right;padding:4px;">'+fmt(te)+'</td>',
        '<td style="text-align:right;padding:4px;">'+fmt(tb)+'</td>')+'</tr>';
      h+='</tbody></table>';
    }
    h+='</div>';
    return h;
  };

  // ---- engine: summary table renderer (port of evbTable) ----
  // % color: default reproduces legacy pctColor (green at 100%); the Highlight-complete

  function pctColorFor(pct,def){

  RENDERERS.table=function(def,rows){

        '<td style="text-align:right;padding:4px;">'+(tb?(te/tb*100).toFixed(0):0)+'%</td>',

  // ---- engine: bar list renderer (port of barRows + its panel wrapper) ----
  // Note: standardizes the inter-bar gap to 6px (legacy ROC used 5px, Shop 6px — a 1px accident).
  RENDERERS.barList=function(def,rows){
    var groups=sortGroups(groupAgg(rows,def.groupBy,def.measure),def.sort),

  VEDITORS.trend=function(def){

    return edInput('Label','title',def.title)
      +edSelectR('Mode','mode',def.mode||'cumulative',[['cumulative','Cumulative'],['perWeek','Per-week']])
      +edSelect('Measure','measure',def.measure||'basis',MEASURE_OPTS)
      +edSelect('Week start','weekStart',def.weekStart||'mon',[['mon','Monday'],['sun','Sunday']])
      +'<div style="border-top:1px solid #eceef2;padding-top:10px;">'
        +edColor('Bar color','barColor',def,'#1e1b6b')
        +(isCum?edToggleR('Highlight complete','highlightComplete',def.highlightComplete!==false)+(def.highlightComplete!==false?edColor('Complete color','completeColor',def,'#2bb24c'):''):'<div style="font-size:10px;color:#9a9aa6;margin:2px 0;">Highlight-complete applies to Cumulative mode only.</div>')
      +'</div>'
      +edExclude(def);
  };
  VEDITORS.statTiles=function(def){
    return edInput('Title','title',def.title)
      +edSelect('Aggregate','aggregate',def.aggregate||'count',[['count','Count of rows'],['qty','Sum of Quantity'],['budgetMH','Sum of BudgetMHs'],['earnMH','Sum of EarnMHsCalc'],['earnQtyEntry','Sum of Earned Qty Entry'],['clientBudget','Sum of ClientBudget']])
      +'<div style="border-top:1px solid #eceef2;padding-top:10px;">'+edFld('Complete')
        +edInput('Tile label','complete.label',getPath(def,'complete.label'))
        +'<label style="font-size:10px;font-weight:700;color:#5a5a68;display:block;margin-bottom:3px;">Where</label>'+filterBuilder(def,'complete.where')
      +'</div>'
      +'<div style="border-top:1px solid #eceef2;padding-top:10px;">'+edFld('Total')
        +edInput('Tile label','total.label',getPath(def,'total.label'))
        +'<label style="font-size:10px;font-weight:700;color:#5a5a68;display:block;margin-bottom:3px;">Where</label>'+filterBuilder(def,'total.where')
      +'</div>'
      +'<div style="border-top:1px solid #eceef2;padding-top:10px;">'
        +edToggleR('Show ring','showRing',def.showRing!==false)
        +(def.showRing!==false?edColor('Ring color','colorProgress',def,'#1e1b6b')+edColor('Remaining color','colorRemaining',def,'#e6e6ee'):'')
        +'<div style="font-size:10px;color:#9a9aa6;margin-top:2px;">Ring % = Complete ÷ Total.</div>'
      +'</div>';
  };

  // Find a visual's shipped-default def (in DEFAULT_LAYOUT) for "Revert to default".
  function findDefaultDef(id){ var f=null;
    DEFAULT_LAYOUT.row1.forEach(function(col){ col.forEach(function(d){ if(d.id===id) f=d; }); });
    (DEFAULT_LAYOUT.rows||[]).forEach(function(r){ r.visuals.forEach(function(d){ if(d.id===id) f=d; }); });
    return f; }
  function buildEditorPanel(def){
    var host=document.getElementById('vEditor'); if(!host){ host=document.createElement('div'); host.id='vEditor'; document.body.appendChild(host); }
    var body=VEDITORS[def.type] ? VEDITORS[def.type](def) : '<div style="font-size:12px;color:#6a6a78;line-height:1.5;">The editor for the <b>'+esc(typeLabel(def.type))+'</b> visual is coming next. For now you can delete it or leave it as-is.</div>';
    var canRevert=!!findDefaultDef(def.id);
    host.innerHTML='<div style="position:fixed;top:0;right:0;height:100%;width:360px;background:#fff;box-shadow:-6px 0 24px rgba(16,24,40,.18);z-index:60;display:flex;flex-direction:column;font-family:\'Segoe UI\',system-ui,sans-serif;">'
      +'<div style="background:#1e1b6b;color:#fff;padding:11px 15px;display:flex;align-items:center;gap:9px;"><span style="font-size:13px;font-weight:700;">Edit visual — '+esc(typeLabel(def.type))+'</span><span style="flex:1;"></span><span data-ved="cancel" title="Close" style="cursor:pointer;font-size:16px;">&#10005;</span></div>'
      +'<div style="flex:1;overflow-y:auto;padding:14px 15px;">'+body+'</div>'
      +'<div style="border-top:1px solid #e0e0e8;padding:11px 15px;display:flex;align-items:center;gap:8px;background:#fafafc;">'
        +(canRevert?'<button data-ved="revert" title="Reset this visual to its default settings" style="font-size:11px;color:#6a6a78;background:#fff;border:1px solid #cfcfda;border-radius:5px;padding:6px 11px;cursor:pointer;">Revert to default</button>':'')
        +'<span style="flex:1;"></span>'
        +'<button data-ved="preview" title="Update the report to show your changes" style="font-size:11.5px;color:#1e1b6b;background:#eef0fb;border:1px solid #cfcfec;border-radius:5px;padding:7px 13px;cursor:pointer;">Preview</button>'
        +'<button data-ved="cancel" style="font-size:11.5px;color:#2b2b36;background:#fff;border:1px solid #cfcfda;border-radius:5px;padding:7px 13px;cursor:pointer;">Cancel</button>'
        +'<button data-ved="save" style="font-size:11.5px;font-weight:600;color:#fff;background:#1e1b6b;border:none;border-radius:5px;padding:7px 15px;cursor:pointer;">Save visual</button>'
      +'</div>'
    +'</div>';
    document.body.style.paddingRight='360px';
  }
  function openVisualEditor(id){ var def=findDef(id); if(!def) return; _editId=id; _editOrig=clone(def); buildEditorPanel(def); }
  function closeVisualEditor(){ var h=document.getElementById('vEditor'); if(h) h.remove(); document.body.style.paddingRight=''; _editId=null; _editOrig=null; }
  function cancelEditor(){ var def=findDef(_editId); if(def&&_editOrig){ Object.keys(def).forEach(function(k){ delete def[k]; }); Object.assign(def,_editOrig); } closeVisualEditor(); render(); }
  function saveEditor(){ closeVisualEditor(); render(); }
  function previewEditor(){ render(); }
  // Reset the visual being edited to its shipped-default config (form + report), keeping the editor open.
  function revertVisualToDefault(){ var def=findDef(_editId), dd=findDefaultDef(_editId); if(!def||!dd) return; Object.keys(def).forEach(function(k){ delete def[k]; }); Object.assign(def,clone(dd)); buildEditorPanel(def); render(); }
  // Field edits update the working def silently; the report repaints only on Preview / Save (no per-keystroke re-render).
  function applyEditorField(t){
    var f=t.getAttribute('data-vfield'); if(!f||!_editId) return;
    var def=findDef(_editId); if(!def) return;
    var vt=t.getAttribute('data-vtype');
    if(vt==='bool'){ setPath(def,f,!!t.checked); }
    else if(vt==='num'){ var nv=parseInt(t.value,10); setPath(def,f,isNaN(nv)?undefined:nv); }
    else if(t.getAttribute('data-hex')){ var hx=t.value.trim(); if(!/^#?[0-9a-fA-F]{6}$/.test(hx)) return; if(hx.charAt(0)!=='#') hx='#'+hx; setPath(def,f,hx); var pc=t.parentNode.querySelector('input[type="color"][data-vfield="'+f+'"]'); if(pc) pc.value=hx; }
    else if(t.type==='color'){ setPath(def,f,t.value); var ph=t.parentNode.querySelector('input[data-hex][data-vfield="'+f+'"]'); if(ph) ph.value=t.value.toUpperCase(); }
    else { setPath(def,f,t.value); }
    if(t.getAttribute('data-vrebuild')) buildEditorPanel(def);
  }

  // ---- master render ----
  function render(){
    var app=document.getElementById('app');
    if(!loaded){ app.innerHTML='<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#faf9f5;color:#9a9aa6;font-size:16px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">Loading dashboard…</div>'; return; }
    if(!ROWS.length){ app.innerHTML=headerHTML(); return; }
    var rows=filtered();
    if(printMode){
      // PDF/print: report only — no filter rail, no edit chrome, full width.
      app.innerHTML=headerHTML()+'<div class="printwrap" style="padding:12px 16px 12px;"><main class="col">'+renderLayout(activeLayout,rows,false)+'</main></div>';
    } else {
      app.innerHTML=headerHTML()+(customize?managerToolbar():'')
        +'<div style="display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 16px 0;align-items:start;">'
          +railHTML()
          +'<main class="col">'+renderLayout(activeLayout,rows,customize)+'</main>'
        +'</div>';
    }
    var fl=document.querySelector('[data-footer="left"]');  if(fl) fl.textContent=(activeLayout.footer&&activeLayout.footer.left)||'';
    var fr=document.querySelector('[data-footer="right"]'); if(fr) fr.textContent=(activeLayout.footer&&activeLayout.footer.right)||'';
    var ts=document.getElementById('trendScroll'); if(ts) ts.scrollLeft=ts.scrollWidth;
    var ws=document.getElementById('weeklyScroll'); if(ws) ws.scrollLeft=ws.scrollWidth;
  }

  // ---- interactions (delegated; survive re-render) ----
  function toggle(k,v){ if(String(filters[k])===String(v)) delete filters[k]; else filters[k]=v; render(); }
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.getAttribute&&t.getAttribute('data-role')==='basis'){ basis=t.value; render(); }
    else if(t.getAttribute&&t.getAttribute('data-role')==='slicer'){ var k=t.getAttribute('data-key'); if(t.value==='__all') delete filters[k]; else filters[k]=t.value; render(); }
  });
  document.addEventListener('click',function(e){
    if(customize) return;   // filtering/sorting is disabled while editing the layout
    var el=e.target.closest?e.target.closest('[data-toggle-key],[data-chip],[data-clear],[data-sort],[data-import]'):null;
    if(!el) return;
    if(el.hasAttribute('data-import')){ document.getElementById('fileInput').click(); }
    else if(el.hasAttribute('data-clear')){ filters={}; render(); }
    else if(el.hasAttribute('data-chip')){ delete filters[el.getAttribute('data-chip')]; render(); }
    else if(el.hasAttribute('data-toggle-key')){ toggle(el.getAttribute('data-toggle-key'),el.getAttribute('data-toggle-val')); }
    else if(el.hasAttribute('data-sort')){ var k=el.getAttribute('data-sort'); if(mSort===k) mDir=(mDir==='desc'?'asc':'desc'); else {mSort=k;mDir='desc';} render(); }
  });
  // Customize-mode controls (manager toolbar + per-visual edit/delete).
  document.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-cz],[data-del-vid],[data-edit-vid]'):null;
    if(!el) return;
    if(el.hasAttribute('data-cz')){ czAction(el.getAttribute('data-cz')); }
    else if(el.hasAttribute('data-del-vid')){ deleteVisual(el.getAttribute('data-del-vid')); }
    else if(el.hasAttribute('data-edit-vid')){ openVisualEditor(el.getAttribute('data-edit-vid')); }
  });
  // Add-visual / add-row / remove-row / type-picker.
  document.addEventListener('click',function(e){
    var av=e.target.closest?e.target.closest('[data-addvis]'):null; if(av){ openTypePicker(av.getAttribute('data-addvis')); return; }
    var nt=e.target.closest?e.target.closest('[data-newtype]'):null; if(nt){ addVisual(nt.getAttribute('data-newtype')); return; }
    var pc=e.target.closest?e.target.closest('[data-pickcancel]'):null; if(pc){ closeTypePicker(); return; }
    var ar=e.target.closest?e.target.closest('[data-addrow]'):null; if(ar){ if(!activeLayout.rows) activeLayout.rows=[]; activeLayout.rows.push({visuals:[]}); render(); return; }
    var dr=e.target.closest?e.target.closest('[data-delrow]'):null; if(dr){ (activeLayout.rows||[]).splice(+dr.getAttribute('data-delrow'),1); render(); return; }
    var mr=e.target.closest?e.target.closest('[data-moverow]'):null; if(mr){ var pp=mr.getAttribute('data-moverow').split(':'), ri=+pp[0], j=(pp[1]==='up')?ri-1:ri+1, rr=activeLayout.rows||[]; if(j>=0&&j<rr.length){ var t=rr[ri]; rr[ri]=rr[j]; rr[j]=t; render(); } return; }
  });
  // Footer text edits (edit mode) — no re-render needed; the inputs hold the value.
  document.addEventListener('input',function(e){ var t=e.target; if(t&&t.getAttribute&&t.getAttribute('data-footedit')){ if(!activeLayout.footer) activeLayout.footer={}; activeLayout.footer[t.getAttribute('data-footedit')]=t.value; } });
  // Visual-editor: live-apply field edits, and Cancel/Save.
  function edFieldEvt(e){ var t=e.target; if(t&&t.getAttribute&&t.getAttribute('data-vfield')) applyEditorField(t); }
  document.addEventListener('input',edFieldEvt);
  document.addEventListener('change',edFieldEvt);
  document.addEventListener('click',function(e){ var el=e.target.closest?e.target.closest('[data-ved]'):null; if(!el) return; var a=el.getAttribute('data-ved');
    if(a==='cancel') cancelEditor(); else if(a==='save') saveEditor(); else if(a==='preview') previewEditor(); else if(a==='revert') revertVisualToDefault(); });
  // Filter-builder: apply condition edits + add/remove rows.
  function edCondEvt(e){ var t=e.target; if(!t||!t.getAttribute||!t.getAttribute('data-cond')||!_editId) return; var def=findDef(_editId); if(!def) return; var arr=condArr(def,t.getAttribute('data-cond')), ci=+t.getAttribute('data-ci'); if(!arr[ci]) return; arr[ci][t.getAttribute('data-cprop')]=t.value; if(t.getAttribute('data-condrebuild')) buildEditorPanel(def); }
  document.addEventListener('input',edCondEvt);
  document.addEventListener('change',edCondEvt);
  document.addEventListener('click',function(e){
    var add=e.target.closest?e.target.closest('[data-condadd]'):null;
    if(add&&_editId){ var da=findDef(_editId); if(da){ condArr(da,add.getAttribute('data-condadd')).push({field:'roc',op:'Equals',value:'',logic:'AND'}); buildEditorPanel(da); } return; }
    var rem=e.target.closest?e.target.closest('[data-condrem]'):null;
    if(rem&&_editId){ var dr=findDef(_editId); if(dr){ condArr(dr,rem.getAttribute('data-condrem')).splice(+rem.getAttribute('data-ci'),1); buildEditorPanel(dr); } return; }
  });
  document.addEventListener('click',function(e){ var el=e.target.closest?e.target.closest('[data-vp]'):null; if(!el) return; czPromptClose(el.getAttribute('data-vp')==='ok'); });
  document.addEventListener('dragover',function(e){ if(e.target.closest&&e.target.closest('[data-import]')){ e.preventDefault(); } });
  document.addEventListener('drop',function(e){ if(e.target.closest&&e.target.closest('[data-import]')){ e.preventDefault(); var f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) readFile(f); } });

  // ---- file import (CSV + XLSX, no external libs) ----
  function onFile(e){ var f=e.target.files&&e.target.files[0]; if(f) readFile(f); e.target.value=''; }
  function readFile(f){
    fileName=f.name;
    var ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext==='csv'){ var rd=new FileReader(); rd.onload=function(ev){ try{ loadVantageData(parseCSV(ev.target.result)); }catch(err){ alert('Import failed: '+err.message); } }; rd.readAsText(f); }
    else { f.arrayBuffer().then(parseXLSX).then(function(arr){ loadVantageData(arr); }).catch(function(err){ alert('Import failed: '+err.message); }); }
  }
  function parseCSV(text){
    var lines=text.split(/\r?\n/).filter(function(l){return l.length;});
    if(!lines.length) return [];
    function split(l){ var out=[],cur='',q=false,i; for(i=0;i<l.length;i++){ var c=l[i]; if(q){ if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; } else { if(c===','){out.push(cur);cur='';} else if(c==='"')q=true; else cur+=c; } } out.push(cur); return out; }
    var hdr=split(lines[0]), out=[];
    for(var i=1;i<lines.length;i++){ var cells=split(lines[i]), o={}; for(var j=0;j<hdr.length;j++) o[hdr[j].trim()]=cells[j]; out.push(o); }
    return out;
  }
  // Minimal XLSX reader: ZIP central directory + native DecompressionStream inflate.
  async function parseXLSX(buf){
    var bytes=new Uint8Array(buf), dv=new DataView(buf), i;
    var eocd=-1; for(i=bytes.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
    if(eocd<0) throw new Error('Not a valid .xlsx');
    var cnt=dv.getUint16(eocd+10,true), p=dv.getUint32(eocd+16,true), files={};
    for(var n=0;n<cnt;n++){ if(dv.getUint32(p,true)!==0x02014b50) break;
      var method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
      var name=new TextDecoder().decode(bytes.slice(p+46,p+46+nlen));
      files[name]={method:method,csize:csize,lho:lho}; p+=46+nlen+elen+clen; }
    async function read(name){ var f=files[name]; if(!f) return null;
      var lnlen=dv.getUint16(f.lho+26,true), lelen=dv.getUint16(f.lho+28,true), start=f.lho+30+lnlen+lelen, comp=bytes.slice(start,start+f.csize);
      if(f.method===0) return new TextDecoder().decode(comp);
      var ds=new DecompressionStream('deflate-raw'), ab=await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer();
      return new TextDecoder().decode(new Uint8Array(ab)); }
    var ssXml=await read('xl/sharedStrings.xml'), strings=[];
    if(ssXml){ var re=/<(?:x:)?si>([\s\S]*?)<\/(?:x:)?si>/g,m; while(m=re.exec(ssXml)){ var t=m[1].match(/<(?:x:)?t[^>]*>([\s\S]*?)<\/(?:x:)?t>/g)||[]; strings.push(t.map(function(x){return x.replace(/<[^>]+>/g,'');}).join('')); } }
    var sheet=await read('xl/worksheets/sheet1.xml'); if(!sheet) throw new Error('No sheet1');
    var nsx=sheet.indexOf('<x:row')>=0?'x:':'';
    function colIdx(ref){ var c=ref.match(/^[A-Z]+/)[0],x=0,k; for(k=0;k<c.length;k++) x=x*26+(c.charCodeAt(k)-64); return x-1; }
    function decode(s){ return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&'); }
    var rowRe=new RegExp('<'+nsx+'row[^>]*>([\\s\\S]*?)<\\/'+nsx+'row>','g'), rows=[], rm;
    var cellReSrc='<'+nsx+'c r="([A-Z]+\\d+)"(?:[^>]*t="([^"]*)")?[^>]*>(?:<'+nsx+'v>([\\s\\S]*?)<\\/'+nsx+'v>|<'+nsx+'is><'+nsx+'t[^>]*>([\\s\\S]*?)<\\/'+nsx+'t><\\/'+nsx+'is>)?<\\/'+nsx+'c>';
    while(rm=rowRe.exec(sheet)){ var cells={}, cre=new RegExp(cellReSrc,'g'), cm;
      while(cm=cre.exec(rm[1])){ var idx=colIdx(cm[1]), t=cm[2], v=cm[3], inl=cm[4], val=null;
        if(inl!=null) val=decode(inl); else if(v!=null){ val = t==='s' ? strings[+v] : decode(v); }
        cells[idx]=val; }
      rows.push(cells); }
    if(!rows.length) return [];
    var header=rows[0], out=[];
    for(i=1;i<rows.length;i++){ var o={},any=false; for(var c in rows[i]){ var key=header[c]; if(key!=null){ o[key]=rows[i][c]; any=true; } } if(any) out.push(o); }
    return out;
  }

  // ---- PUBLIC ENTRY POINT ----
  window.loadVantageData=function(activities){
    ROWS=(activities||[]).map(normalize);
    loaded=true; filters={};
    render();
    if(window.chrome&&window.chrome.webview){ try{ window.chrome.webview.postMessage({rendered:true,rows:ROWS.length}); }catch(e){} }
  };

  // ---- boot ----
  function boot(){
    document.getElementById('fileInput').addEventListener('change',onFile);
    if(typeof window.__VANTAGE_DATA__!=='undefined' && window.__VANTAGE_DATA__){ if(typeof window.__VANTAGE_PROJECTS__!=='undefined' && window.__VANTAGE_PROJECTS__) PROJECTS=window.__VANTAGE_PROJECTS__; window.loadVantageData(window.__VANTAGE_DATA__); }
    else { render(); }
    window.vantageDashboardReady=true;
    document.dispatchEvent(new CustomEvent('vantage-dashboard-ready'));
    if(window.chrome&&window.chrome.webview){ window.chrome.webview.addEventListener('message',function(e){
      var d=e.data; if(!d) return;
      if(d.activities){ if(d.projects) PROJECTS=d.projects; window.loadVantageData(d.activities); return; }
      if(d.type==='setCustomize'){ setCustomizeMode(d.on); return; }
      if(d.type==='setLayout'){ activeLayout=d.layout?d.layout:clone(DEFAULT_LAYOUT); render(); return; }
      if(d.type==='setPrintMode'){ setPrintMode(d.on); return; }
    }); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
