<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Dashboard</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#e9e9ee;font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:#26262e;-webkit-font-smoothing:antialiased;}
  a{color:#1e1b6b;text-decoration:none;} a:hover{color:#3a9fd6;}
  select{font-family:inherit;}
  table{border-collapse:collapse;}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-thumb{background:#b9b9c4;border-radius:6px;border:2px solid #e9e9ee;}
  ::-webkit-scrollbar-track{background:transparent;}
  .panel{background:#fff;border:1px solid #e2e2e9;border-radius:4px;padding:10px 12px;}
  .ttl{font-size:11px;font-weight:700;letter-spacing:.05em;color:#6c6c7a;text-transform:uppercase;}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0;}
</style>
</head>
<body>
<div id="app"></div>
<input id="fileInput" type="file" accept=".xlsx,.xls,.csv" style="display:none">

  // ---- field mapping: internal key -> exact Vantage export column ----
  var COLMAP={projectId:'ProjectID',status:'Status',comp:'CompType',phase:'PhaseCategory',
    roc:'ROCStep',area:'Area',module:'UDF2',shop:'ShopField',wp:'WorkPackage',
    desc:'Description',tag:'TagNO',line:'LineNumber',dwg:'DwgNO',size:'PipeSize1',uom:'UOM'};
  var NUMMAP={budgetMH:'BudgetMHs',earnMH:'EarnMHsCalc',qty:'Quantity',
    clientBudget:'ClientBudget',percentEntry:'PercentEntry',pct:'PercentCompleteCalc'};
  var DATEMAP={planStart:'PlanStart',planFin:'PlanFin',actStart:'ActStart',actFin:'ActFin'};

  // ---- state ----
  var ROWS=[], filters={}, basis='budgetMH', mSort='_p', mDir='desc', loaded=false, fileName='';

  // ---- coercion helpers (tolerant) ----
  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
  function dateISO(v){
    if(v==null||v==='') return null;
    if(v instanceof Date) return isNaN(v)?null:v.toISOString().slice(0,10);
    var s=String(v).trim();
    if(/^\d+(\.\d+)?$/.test(s)){ var n=parseFloat(s); if(n>1000){ return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10); } }
    var d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10);
  }
  function normalize(a){
    var o={},k;
    for(k in COLMAP){ var v=a[COLMAP[k]]; o[k]=(v==null)?'':String(v); }
    for(k in NUMMAP){ o[k]=num(a[NUMMAP[k]]); }
    for(k in DATEMAP){ o[k]=dateISO(a[DATEMAP[k]]); }
    return o;
  }

  // ---- aggregation ----
  function agg(rows){ var f=basis,b=0,e=0,i; for(i=0;i<rows.length;i++){ var w=+rows[i][f]||0; b+=w; e+=w*((+rows[i].pct||0)/100); } return {budget:b,earn:e,pct:b?e/b*100:0,count:rows.length}; }
  function filtered(){ return ROWS.filter(function(r){ for(var k in filters){ if(filters[k]!=null&&String(r[k])!==String(filters[k])) return false; } return true; }); }
  function distinct(key){ var s={},out=[],i; for(i=0;i<ROWS.length;i++){ var v=ROWS[i][key]; if(v!==''&&v!=null&&!s[v]){ s[v]=1; out.push(String(v)); } } return out.sort(); }
  function fmt(n){ return Math.round(n||0).toLocaleString('en-US'); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function heat(p){ var h=Math.round(Math.max(0,Math.min(100,p))*1.2); return 'hsl('+h+',72%,43%)'; }
  function pctColor(p){ return p>=99.5?GREEN:(p>=1?'#22222c':'#9a9aa6'); }

  // ---- svg donut ----
  function donut(parts,size){
    var r=54,C=2*Math.PI*r,tot=0,i; for(i=0;i<parts.length;i++) tot+=parts[i].value; if(!tot) tot=1;
    var acc=0,segs='';
    for(i=0;i<parts.length;i++){ if(parts[i].value<=0) continue; var frac=parts[i].value/tot,len=frac*C;
      segs+='<circle cx="66" cy="66" r="54" fill="none" stroke="'+parts[i].color+'" stroke-width="20" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc*C).toFixed(2)+'"></circle>'; acc+=frac; }
    return '<svg viewBox="0 0 132 132" style="width:'+size+'px;height:'+size+'px;transform:rotate(-90deg);flex:none;">'+segs+'</svg>';
  }

  // ---- header ----
  function headerHTML(){
    var subtitle = distinct('projectId').join(', ') || '\u2014';
    var lbl = loaded ? 'Import weekly file' : 'Import weekly file';
    var sub = fileName || 'Drop or click to load .xlsx / .csv';
    var logo = LOGO ? '<img src="'+LOGO+'" alt="Summit Industrial" style="max-width:172px;max-height:56px;object-fit:contain;">'
                    : '<div style="font-size:22px;font-weight:800;color:'+NAVY+';">SUMMIT</div>';
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;padding:12px 16px;border-bottom:1px solid #dedee5;position:sticky;top:0;z-index:40;">'
      +'<div style="height:56px;display:flex;align-items:center;flex:none;">'+logo+'</div>'
      +'<div data-import style="display:flex;align-items:center;gap:9px;border:1px dashed #55555f;border-radius:5px;padding:6px 13px;cursor:pointer;flex:none;">'
        +'<span style="font-size:15px;color:#5a5a68;">&#8681;</span>'
        +'<span style="display:flex;flex-direction:column;line-height:1.15;">'
          +'<span style="font-size:11px;font-weight:700;color:#2b2b36;">'+esc(lbl)+'</span>'
          +'<span style="font-size:10px;color:#8a8a96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;">'+esc(sub)+'</span>'
        +'</span>'
      +'</div>'
      +'<div style="text-align:right;flex:1;min-width:0;">'
        +'<div style="font-size:clamp(20px,3vw,34px);font-weight:800;letter-spacing:.01em;color:#1b1b22;line-height:.95;white-space:nowrap;">PROGRESS DASHBOARD</div>'
        +'<div style="font-size:12px;color:#6a6a78;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(subtitle)+'</div>'
      +'</div>'
    +'</div>';
  }

  // ---- filter rail ----
  function railHTML(){
    var dims=[['projectId','Project ID'],['status','Status'],['area','Area'],['phase','Phase'],['shop','Shop / Field'],['comp','Component Type'],['wp','Work Package']];
    var basisOpts=[['budgetMH','BudgetMHs'],['qty','Quantity'],['percentEntry','PercentEntry'],['clientBudget','ClientBudget']];
    var h='<aside class="panel" style="position:sticky;top:70px;padding:12px 12px 14px;">';
    h+='<div style="font-size:11px;font-weight:800;letter-spacing:.06em;color:#3a3a48;text-transform:uppercase;">Filters</div>';
    h+='<div style="font-size:10.5px;color:#8a8a96;margin:2px 0 10px;">'+fmt(filtered().length)+' data rows shown</div>';
    h+='<div style="margin-bottom:12px;"><label style="font-size:10.5px;font-weight:700;color:#5a5a68;">Progress basis</label>';
    h+='<select data-role="basis" style="width:100%;font-size:11.5px;padding:5px 6px;border:1px solid #d3d3dc;border-radius:4px;background:#fafafc;color:#333;margin-top:4px;">';
    basisOpts.forEach(function(o){ h+='<option value="'+o[0]+'"'+(basis===o[0]?' selected':'')+'>'+o[1]+'</option>'; });
    h+='</select></div>';
    dims.forEach(function(d){
      var opts=distinct(d[0]);
      h+='<div style="margin-bottom:11px;"><label style="font-size:10.5px;font-weight:700;color:#5a5a68;">'+d[1]+'</label>';
      h+='<select data-role="slicer" data-key="'+d[0]+'" style="width:100%;font-size:11.5px;padding:5px 6px;border:1px solid #d3d3dc;border-radius:4px;background:#fafafc;color:#333;margin-top:3px;">';
      h+='<option value="__all">All</option>';
      opts.forEach(function(v){ h+='<option value="'+esc(v)+'"'+(String(filters[d[0]])===v?' selected':'')+'>'+esc(v)+'</option>'; });
      h+='</select></div>';
    });

  // ---- trend (weekly cumulative earned MH, Monday week-start) ----
  function trendHTML(rows){

    var weeks=Object.keys(byWeek).sort(), cum=0, pts=weeks.map(function(w){ cum+=byWeek[w]; return {w:w,val:cum}; });
    function wlab(iso){ var p=iso.split('-'); return (+p[1])+'/'+(+p[2]); }

  // ---- interactions (delegated; survive re-render) ----

  // ---- file import (CSV + XLSX, no external libs) ----
  function onFile(e){ var f=e.target.files&&e.target.files[0]; if(f) readFile(f); e.target.value=''; }
  function readFile(f){
    fileName=f.name;
    var ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext==='csv'){ var rd=new FileReader(); rd.onload=function(ev){ try{ loadVantageData(parseCSV(ev.target.result)); }catch(err){ alert('Import failed: '+err.message); } }; rd.readAsText(f); }
    else { f.arrayBuffer().then(parseXLSX).then(function(arr){ loadVantageData(arr); }).catch(function(err){ alert('Import failed: '+err.message); }); }
  }
  function parseCSV(text){
    var lines=text.split(/\r?\n/).filter(function(l){return l.length;});
    if(!lines.length) return [];
    function split(l){ var out=[],cur='',q=false,i; for(i=0;i<l.length;i++){ var c=l[i]; if(q){ if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; } else { if(c===','){out.push(cur);cur='';} else if(c==='"')q=true; else cur+=c; } } out.push(cur); return out; }
    var hdr=split(lines[0]), out=[];
    for(var i=1;i<lines.length;i++){ var cells=split(lines[i]), o={}; for(var j=0;j<hdr.length;j++) o[hdr[j].trim()]=cells[j]; out.push(o); }
    return out;
  }
  // Minimal XLSX reader: ZIP central directory + native DecompressionStream inflate.
  async function parseXLSX(buf){
    var bytes=new Uint8Array(buf), dv=new DataView(buf), i;
    var eocd=-1; for(i=bytes.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
    if(eocd<0) throw new Error('Not a valid .xlsx');
